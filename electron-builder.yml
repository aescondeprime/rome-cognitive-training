appId: com.rome.cognitivetraining
productName: ROME
copyright: "Copyright © 2026 ROME Cognitive Training Lab"

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - node_modules/better-sqlite3/**/*

# Package most application files into app.asar, but keep the Express
# server and native SQLite module on the physical filesystem.
asar: true

asarUnpack:
  - dist/**/*
  - node_modules/better-sqlite3/**/*
  - "**/*.node"

npmRebuild: true

directories:
  output: release
  buildResources: build-resources

# ── macOS ────────────────────────────────────────────────────────────────
mac:
  category: public.app-category.education
  icon: build-resources/icon.icns

  # Allow running without an Apple Developer certificate.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

  target:
    - target: dmg
      arch:
        - x64
        - arm64

dmg:
  title: "ROME — Cognitive Training Lab"
  window:
    width: 540
    height: 380

# ── Windows ──────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64

  icon: build-resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ROME

# ── Auto-update / GitHub Releases ────────────────────────────────────────
publish:
  provider: github
  owner: aescondeprime
  repo: rome-cognitive-training
  private: true
